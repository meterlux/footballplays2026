<title>Olsson's Play Trainer 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one column. Practice-whiteboard field card in the middle, controls below it. The field keeps the playbook's look in both themes. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #14213a;
  --muted: #5b6678;
  --line: #d6dce4;
  --accent: #1d4fd8;
  --accent-ink: #ffffff;
  --gold: #f2b705;
  --good: #1f8a4c;
  --warn: #b86e00;
  --bad: #c62828;
  --field: #fbfcfa;
  --field-grid: #e6eae6;
  --field-line: #c9d0ca;
  --los: #2f5fd0;
  --font-display: "Graduate", "Rockwell", Georgia, serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-cond: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1726; --surface: #182235; --ink: #e8edf6; --muted: #9aa6ba; --line: #2a3750;
    --accent: #6f95ff; --accent-ink: #0b1220; --gold: #f5c430; --good: #4cc27f; --warn: #f0a640; --bad: #ff6b6b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1726; --surface: #182235; --ink: #e8edf6; --muted: #9aa6ba; --line: #2a3750;
  --accent: #6f95ff; --accent-ink: #0b1220; --gold: #f5c430; --good: #4cc27f; --warn: #f0a640; --bad: #ff6b6b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 32px;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
button { font: inherit; color: inherit; }
button:focus-visible, .play-row:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- Menu ---------- */
.brand { display: grid; gap: 2px; padding-top: 6px; }
.brand h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 7vw, 40px); line-height: 1.05; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.brand h1 .num { color: var(--gold); -webkit-text-stroke: 1px var(--ink); }
.brand p { margin: 0; color: var(--muted); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-family: var(--font-cond); font-weight: 600; font-size: 16px; letter-spacing: .03em; text-transform: uppercase; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.quick { display: flex; align-items: center; gap: 12px; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 14px 16px; border: 0; cursor: pointer; text-align: left; width: 100%; }
.quick b { font-family: var(--font-display); font-weight: 400; font-size: 20px; display: block; }
.quick span { font-size: 14px; opacity: .8; }
.quick .go { margin-left: auto; font-family: var(--font-cond); font-weight: 700; background: var(--gold); color: #14213a; padding: 6px 12px; border-radius: 8px; letter-spacing: .04em; }
.group h2 { font-family: var(--font-cond); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 15px; color: var(--muted); margin: 10px 0 6px; display: flex; gap: 8px; align-items: baseline; }
.group h2 small { font-weight: 500; letter-spacing: .02em; text-transform: none; font-family: var(--font-body); }
.list { display: grid; gap: 6px; }
.play-row { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; width: 100%; }
.play-row .n { font-family: var(--font-cond); font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 15px; }
.play-row .t { min-width: 0; }
.play-row .t b { display: block; font-family: var(--font-cond); font-weight: 700; font-size: 19px; line-height: 1.15; }
.play-row .t span { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-family: var(--font-cond); font-weight: 700; font-size: 14px; padding: 3px 8px; border-radius: 6px; border: 1.5px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.badge.good { border-color: var(--good); color: var(--good); }
.badge.mid { border-color: var(--warn); color: var(--warn); }
.badge.low { border-color: var(--bad); color: var(--bad); }
.foot { color: var(--muted); font-size: 13px; }

/* ---------- Play screen ---------- */
.bar { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
.back { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 12px; cursor: pointer; font-family: var(--font-cond); font-weight: 700; font-size: 16px; }
.title { min-width: 0; }
.title .cat { font-family: var(--font-cond); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 13px; color: var(--accent); }
.title h2 { margin: 0; font-family: var(--font-cond); font-weight: 700; font-size: clamp(22px, 5.5vw, 30px); line-height: 1.05; text-wrap: balance; }
.title p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.drillhead { font-family: var(--font-cond); font-weight: 700; font-size: 14px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }

.fieldcard { position: relative; background: var(--field); border-radius: 14px; border: 1px solid var(--line); overflow: hidden; box-shadow: 0 1px 0 rgba(0,0,0,.04); }
.prompt { background: #14213a; color: #fff; border-radius: 10px; padding: 9px 12px; font-weight: 600; font-size: 15px; display: flex; gap: 8px; align-items: center; min-height: 42px; }
.prompt.quiet { background: var(--surface); color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
.prompt.quiet .dot { background: var(--line); animation: none; }
.hint { color: var(--muted); font-size: 13px; margin: -6px 0 0; display: none; }
@media (orientation: portrait) and (max-width: 560px) { .hint { display: block; } }
@media (orientation: landscape) and (max-height: 560px) {
  .wrap { max-width: 1100px; }
  svg.field { max-height: calc(100vh - 20px); }
  .title p { display: none; }
}
@media (max-width: 480px) { .fieldcard { margin-inline: -8px; } }
.prompt .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--gold); flex: none; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.5); opacity: .6; } }
@media (prefers-reduced-motion: reduce) { .prompt .dot { animation: none; } }
svg.field { display: block; width: 100%; height: auto; max-height: 64vh; touch-action: none; user-select: none; -webkit-user-select: none; }
.controls { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
.btn { border: 0; border-radius: 12px; padding: 12px 10px; font-family: var(--font-cond); font-weight: 700; font-size: 19px; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; background: var(--surface); border: 1.5px solid var(--line); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 0 12px; font-family: var(--font-cond); font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--gold); color: #14213a; }
.subcontrols { display: flex; gap: 8px; flex-wrap: wrap; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }

.feedback { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; }
.score { display: flex; align-items: center; gap: 14px; }
.ring { --p: 0; width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(var(--rc, var(--good)) calc(var(--p) * 1%), var(--line) 0); }
.ring span { width: 50px; height: 50px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-family: var(--font-cond); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.score h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.score p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.tips { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.tips li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; }
.tips li i { font-style: normal; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; background: var(--warn); }
.tips li.ok i { background: var(--good); }
.tips li.no i { background: var(--bad); }
.tips li.info i { background: var(--accent); color: var(--accent-ink); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend svg { width: 26px; height: 8px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 140px; font-size: 17px; padding: 10px; }

.summary { display: grid; gap: 8px; }
.summary .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.summary .row b { font-family: var(--font-cond); font-size: 18px; }
.summary .row span { color: var(--muted); font-size: 13px; display: block; }

/* ---------- v0.2: menu groups ---------- */
.howto { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 14px; }
.howto li { display: flex; gap: 6px; align-items: center; }
.howto b { width: 20px; height: 20px; border-radius: 50%; background: var(--gold); color: #14213a; display: grid; place-items: center; font-family: var(--font-cond); font-size: 13px; flex: none; }
.groups { display: grid; gap: 10px; }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.ghead { width: 100%; display: grid; grid-template-columns: 14px 1fr auto 22px; gap: 12px; align-items: center; text-align: left; background: none; border: 0; padding: 14px 16px; cursor: pointer; }
.ghead .gmark { width: 14px; height: 14px; border-radius: 50%; }
.ghead .gtext { min-width: 0; }
.ghead .gname { font-family: var(--font-cond); font-weight: 700; font-size: 22px; line-height: 1.1; display: block; }
.ghead .gdesc { color: var(--muted); font-size: 13px; display: block; }
.ghead .gcount { font-family: var(--font-cond); font-weight: 700; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ghead svg { width: 22px; height: 22px; color: var(--muted); transition: transform .2s ease; }
.ghead[aria-expanded="true"] svg { transform: rotate(180deg); }
.group .list { padding: 0 10px 10px; }
.group .play-row { background: var(--bg); border-color: transparent; }
.foot .link { font-size: 13px; }

/* ---------- v0.2: play screen steps + position picker ---------- */
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.steps li { font-family: var(--font-cond); font-weight: 700; font-size: 14px; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid var(--line); padding: 4px 2px 5px; display: flex; gap: 6px; align-items: center; min-width: 0; }
.steps li b { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; flex: none; }
.steps li.on { color: var(--ink); border-color: var(--gold); }
.steps li.on b { background: var(--gold); border-color: var(--gold); color: #14213a; }
.steps li.done { color: var(--good); border-color: var(--good); }
.steps li.done b { background: var(--good); border-color: var(--good); color: #fff; }
.prompt { flex-wrap: wrap; align-items: flex-start; }
.prompt .msg { flex: 1 1 200px; min-width: 0; }
.prompt .dot { margin-top: 5px; }
.pchips { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; padding-left: 20px; }
.pchip { border: 2px solid rgba(255,255,255,.85); border-radius: 999px; padding: 4px 12px; font-family: var(--font-cond); font-weight: 700; font-size: 17px; color: #fff; cursor: pointer; min-width: 42px; }
.pchip.dark { color: #2a2200; }
.prompt .link { color: #f2b705; font-size: 14px; padding: 0 0 0 4px; }

/* ---------- v0.2: intro ---------- */
.intro { position: fixed; inset: 0; z-index: 50; background: #0f1a30; color: #ffffff; display: grid; place-items: center; overflow: hidden;
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
  transition: opacity .45s ease, visibility .45s; }
.intro.gone { opacity: 0; visibility: hidden; }
.intro svg.introfield { position: absolute; inset: 0; width: 100%; height: 100%; }
.intro-in { position: relative; display: grid; gap: 14px; justify-items: center; text-align: center; max-width: 440px; padding: 30px 20px;
  background: radial-gradient(closest-side, rgba(15,26,48,.94), rgba(15,26,48,.7) 65%, rgba(15,26,48,0)); }
.intro .eyebrow { font-family: var(--font-cond); font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #f2b705; font-size: 14px; margin: 0; }
.intro h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(36px, 11vw, 56px); line-height: 1.02; margin: 0; text-wrap: balance; }
.intro h1 .w { display: inline-block; opacity: 0; transform: translateY(18px); animation: rise .6s cubic-bezier(.2,.8,.2,1) forwards; }
.intro h1 .yr { display: block; color: #f2b705; font-size: .6em; letter-spacing: .24em; margin-top: 8px; }
@keyframes rise { to { opacity: 1; transform: none; } }
.intro .sub { margin: 0; color: #c9d3e6; font-size: 16px; max-width: 30ch; opacity: 0; animation: rise .6s .9s forwards; }
.intro .start { opacity: 0; animation: rise .5s 1.25s forwards; font-size: 24px; padding: 14px 56px; background: #f2b705; color: #14213a; border: 0; border-radius: 14px; }
.intro .a2hs-link { color: #ffffff; opacity: 0; animation: rise .5s 1.5s forwards; background: none; border: 0; text-decoration: underline; text-underline-offset: 4px; font-weight: 600; font-size: 15px; cursor: pointer; padding: 6px; }
.intro .ver { margin: 0; font-size: 12px; color: #8e9bb5; opacity: 0; animation: rise .5s 1.7s forwards; }
@media (prefers-reduced-motion: reduce) { .intro h1 .w, .intro .sub, .intro .start, .intro .a2hs-link, .intro .ver { animation: none; opacity: 1; transform: none; } }

/* ---------- v0.2: Add to Home Screen guide ---------- */
.modal { position: fixed; inset: 0; z-index: 60; background: rgba(8,14,28,.75); display: grid; place-items: center; padding: 16px; }
.mcard { background: var(--surface); color: var(--ink); border-radius: 18px; width: min(380px, 100%); padding: 16px 16px 18px; display: grid; gap: 12px; justify-items: center; max-height: calc(100% - 8px); overflow: auto; }
.mcard h2 { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 0; }
.mcard .caption { min-height: 46px; margin: 0; text-align: center; font-weight: 600; font-size: 16px; text-wrap: balance; }
.mcard .small { margin: 0; color: var(--muted); font-size: 13px; text-align: center; }
.stepdots { display: flex; gap: 6px; }
.stepdots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.stepdots i.on { background: var(--gold); }
.mcard .actions { width: 100%; }
.phone { width: 200px; height: 396px; border-radius: 30px; background: #0b0f18; padding: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.35); flex: none; }
.scr { position: relative; width: 100%; height: 100%; border-radius: 23px; overflow: hidden; background: #f4f6f9; color: #111111; font: 11px/1.25 -apple-system, system-ui, sans-serif; }
.scr .ly { position: absolute; inset: 0; transition: opacity .35s ease, transform .5s cubic-bezier(.2,.8,.2,1); }
.mini-head { background: #14213a; color: #ffffff; padding: 30px 10px 10px; font-family: var(--font-display); font-size: 13px; }
.mini-field { position: absolute; left: 10px; right: 10px; top: 92px; height: 150px; border-radius: 8px; background: #ffffff; border: 1px solid #dfe3e8; }
.mini-field i { position: absolute; width: 12px; height: 12px; border-radius: 50%; }
.ios-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: rgba(247,247,250,.98); border-top: 1px solid #d9dbe0; }
.ios-bar .url { margin: 6px 10px 0; height: 20px; border-radius: 7px; background: #e6e7eb; display: grid; place-items: center; color: #555; font-size: 9px; }
.ios-bar .icons { display: flex; justify-content: space-around; align-items: center; height: 34px; color: #1a73e8; }
.ios-bar svg, .and-bar svg { width: 18px; height: 18px; }
.hlt { border-radius: 8px; transition: box-shadow .3s, background .3s; }
.sheet { display: flex; flex-direction: column; position: absolute; left: 0; right: 0; bottom: 0; height: 80%; background: #f2f2f7; border-radius: 14px 14px 0 0; transform: translateY(105%); transition: transform .5s cubic-bezier(.2,.8,.2,1); overflow: hidden; box-shadow: 0 -4px 16px rgba(0,0,0,.18); }
.sheet .top { display: flex; gap: 8px; align-items: center; padding: 10px; background: #ffffff; }
.appicon { width: 30px; height: 30px; border-radius: 8px; background: #14213a; position: relative; flex: none; overflow: hidden; }
.appicon::before { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; height: 2px; background: #6f95ff; }
.appicon::after { content: ""; position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #f2b705; left: 11px; top: 17px; box-shadow: -7px -9px 0 -1px #9b1fc4, 8px -9px 0 -1px #2a9d45; }
.sheet .rowsvp { flex: 1; overflow: hidden; }
.sheet .rows { padding: 8px; transition: transform 1.1s ease .4s; display: grid; gap: 1px; }
.sheet .row { background: #ffffff; padding: 9px 10px; display: flex; justify-content: space-between; align-items: center; }
.sheet .row:first-child { border-radius: 8px 8px 0 0; } .sheet .row:last-child { border-radius: 0 0 8px 8px; }
.addsc, .homesc, .and-dlg, .and-menu { opacity: 0; pointer-events: none; }
.addsc { background: #f2f2f7; }
.addsc .nav { display: flex; justify-content: space-between; align-items: center; padding: 30px 10px 10px; background: #ffffff; border-bottom: 1px solid #ddd; }
.addsc .nav b { color: #1a73e8; padding: 3px 6px; }
.addsc .card { margin: 12px 10px; background: #ffffff; border-radius: 8px; padding: 10px; display: flex; gap: 10px; align-items: center; }
.homesc { background: linear-gradient(160deg, #3c5a99, #7a4b8f); padding: 40px 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 10px; align-content: start; }
.homesc span { width: 34px; height: 34px; border-radius: 9px; background: rgba(255,255,255,.35); justify-self: center; }
.homesc .mine { display: grid; justify-items: center; gap: 3px; color: #ffffff; font-size: 8px; }
.homesc .mine .appicon { width: 34px; height: 34px; border-radius: 9px; transform: scale(0); transition: transform .5s cubic-bezier(.3,1.6,.5,1) .3s; }
.and-bar { position: absolute; left: 0; right: 0; top: 0; padding: 26px 8px 6px; background: #ffffff; display: flex; gap: 6px; align-items: center; border-bottom: 1px solid #ddd; }
.and-bar .url { flex: 1; height: 22px; border-radius: 11px; background: #eef0f3; display: grid; place-items: center; color: #555; font-size: 9px; }
.and-bar .dots { width: 24px; height: 24px; display: grid; place-items: center; font-size: 16px; font-weight: 700; color: #333; }
.and-menu { position: absolute; right: 6px; top: 30px; width: 140px; background: #ffffff; border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.25); padding: 4px 0; transform-origin: top right; transform: scale(.8); }
.and-menu div { padding: 8px 12px; }
.and-menu, .and-dlg { transition: opacity .3s ease, transform .35s cubic-bezier(.2,.8,.2,1); }
.and-dlg { position: absolute; left: 14px; right: 14px; top: 120px; background: #ffffff; border-radius: 12px; padding: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.3); display: grid; gap: 10px; }
.and-dlg .btns { display: flex; justify-content: flex-end; gap: 14px; color: #1a73e8; font-weight: 700; }
.and-dlg .btns b { padding: 3px 6px; }
.finger { position: absolute; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; background: rgba(20,33,58,.32); border: 2px solid #ffffff; box-shadow: 0 2px 6px rgba(0,0,0,.3); opacity: 0; transition: left .6s ease, top .6s ease, opacity .3s; z-index: 5; pointer-events: none; }
.finger.tap { animation: tap .5s ease; }

</style>

<div class="wrap" id="app"></div>

<script>
const PLAYS = /*__PLAYS__*/[];
const SOURCE = /*__SOURCE__*/{};

/* ---------------- constants ---------------- */
const COLORS = {
  X: '#9b1fc4', Z: '#9b1fc4', h: '#f0561e', H: '#2a9d45', TE: '#d9a900', Q: '#df1b1b',
  OL: '#6b7280', DEF_RED: '#d91c1c', DEF_TEAL: '#007a70', OPP: '#8a94a3'
};
const ROLE = {
  X: 'X receiver', Z: 'Z receiver', h: 'H-back (h)', H: 'Running back (H)', TE: 'Tight end', Q: 'Quarterback',
  LT: 'Left tackle', LG: 'Left guard', C: 'Center', RG: 'Right guard', RT: 'Right tackle',
  E: 'Defensive end', T: 'Tackle', N: 'Nose', S: 'Sam linebacker', W: 'Will linebacker', M: 'Mike linebacker',
  B: 'Buck linebacker', FS: 'Free safety', '$': 'Safety'
};
const TEAL_LABELS = new Set(['C', 'FS', 'SS', '$', 'CB']);
const VERSION = 'v0.2';
const APP_NAME = "Olsson's Play Trainer";
const CATS = ['Formation', 'Run', 'Pass', 'Defense'];
const CAT_INFO = {
  Formation: { desc: 'Where everyone lines up before the snap', mark: '#6b7280' },
  Run: { desc: 'Zone, stretch, sweep, counters, dive and jet', mark: '#2a9d45' },
  Pass: { desc: 'Quick, deep and ISO routes, plus protection', mark: '#9b1fc4' },
  Defense: { desc: '4-4 fronts, coverages and blitzes', mark: '#d91c1c' }
};
const CAT_LABEL = { Formation: 'Formations', Run: 'Run plays', Pass: 'Pass plays', Defense: 'Defense' };
const SPEED = { learn: 2.6, real: 7.5 };   // yards per second
const MOTION_SPEED = { learn: 2.2, real: 5.5 };

/* ---------------- storage ---------------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('cpt:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('cpt:' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------------- geometry ---------------- */
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function polyLen(p) { let s = 0; for (let i = 1; i < p.length; i++) s += dist(p[i - 1], p[i]); return s; }
function pointAt(p, d) {
  if (p.length === 1) return p[0].slice();
  for (let i = 1; i < p.length; i++) {
    const L = dist(p[i - 1], p[i]);
    if (d <= L || i === p.length - 1) {
      const t = L ? Math.max(0, Math.min(1, d / L)) : 1;
      return [p[i - 1][0] + (p[i][0] - p[i - 1][0]) * t, p[i - 1][1] + (p[i][1] - p[i - 1][1]) * t];
    }
    d -= L;
  }
  return p[p.length - 1].slice();
}
function resample(p, n) { const L = polyLen(p); const out = []; for (let i = 0; i < n; i++) out.push(pointAt(p, L * i / (n - 1))); return out; }
function nearestOnPoly(p, q) {
  let best = Infinity, bestS = 0, acc = 0;
  for (let i = 1; i < p.length; i++) {
    const a = p[i - 1], b = p[i]; const dx = b[0] - a[0], dy = b[1] - a[1]; const L2 = dx * dx + dy * dy;
    const t = L2 ? Math.max(0, Math.min(1, ((q[0] - a[0]) * dx + (q[1] - a[1]) * dy) / L2)) : 0;
    const pt = [a[0] + dx * t, a[1] + dy * t]; const d = dist(pt, q);
    if (d < best) { best = d; bestS = acc + Math.sqrt(L2) * t; }
    acc += Math.sqrt(L2);
  }
  return { d: best, s: bestS };
}
function angleOf(v) { return Math.atan2(v[1], v[0]); }
function angDiff(a, b) { let d = Math.abs(a - b) % (2 * Math.PI); return d > Math.PI ? 2 * Math.PI - d : d; }

/* ---------------- play helpers ---------------- */
function isDefPlay(play) { return play.cat === 'Defense'; }
function playerColor(play, p) {
  if (p.team === 'opp') return COLORS.OPP;
  if (p.team === 'def') return TEAL_LABELS.has(p.label) ? COLORS.DEF_TEAL : COLORS.DEF_RED;
  if (['LT', 'LG', 'C', 'RG', 'RT'].includes(p.id)) return COLORS.OL;
  return COLORS[p.id] || COLORS.OL;
}
function selectable(play, p) { return isDefPlay(play) ? p.team === 'def' : p.team !== 'opp'; }
function fullRoute(p) { return [[p.x, p.y], ...(p.motion || []), ...(p.path || [])]; }
function hasRoute(p) { return polyLen(fullRoute(p)) > 0.5; }
function huddleSpot(play) {
  let maxY = -Infinity; play.players.forEach(p => { maxY = Math.max(maxY, p.y); });
  return [0, maxY + 3.5];
}
function roleName(p) { const l = p.label || p.id; return ROLE[l] ? ROLE[l] : l; }
function dotRadius(play) {
  let m = Infinity; const ps = play.players;
  for (let i = 0; i < ps.length; i++) for (let j = i + 1; j < ps.length; j++) m = Math.min(m, dist([ps[i].x, ps[i].y], [ps[j].x, ps[j].y]));
  if (!isFinite(m)) m = 2.5;
  return Math.max(0.55, Math.min(1.15, m * 0.46));
}
function bounds(play) {
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  const add = (x, y, r = 0) => { x0 = Math.min(x0, x - r); x1 = Math.max(x1, x + r); y0 = Math.min(y0, y - r); y1 = Math.max(y1, y + r); };
  play.players.forEach(p => fullRoute(p).forEach(q => add(q[0], q[1])));
  (play.zones || []).forEach(z => add(z.x, z.y, z.r));
  if (play.cat === 'Formation') { const h = huddleSpot(play); add(h[0], h[1]); }
  const pad = 1.6;
  x0 -= pad; x1 += pad; y0 -= pad + 0.6; y1 += pad;
  let w = x1 - x0, h = y1 - y0;
  if (w < 24) { const c = (x0 + x1) / 2; x0 = c - 12; x1 = c + 12; w = 24; }
  if (h < 11) { const c = (y0 + y1) / 2; y0 = c - 5.5; y1 = c + 5.5; h = 11; }
  return { x0, y0, w, h };
}

/* ---------------- words for directions ---------------- */
// Offense faces up the screen (upfield = -y). Defense in these diagrams also lines up below the ball, so "deeper" = +y.
function lateralWord(play, p, dx) {
  // Offense and defense both face the top of the screen in these diagrams, so screen right is the player's right.
  return dx > 0 ? 'to your right' : 'to your left';
}
function dirWords(play, p, v) {
  const [dx, dy] = v; const ax = Math.abs(dx), ay = Math.abs(dy);
  const def = isDefPlay(play);
  const vert = def ? (dy > 0 ? 'deeper' : 'up toward the ball') : (dy < 0 ? 'upfield' : 'back toward the line');
  const lat = lateralWord(play, p, dx);
  if (ax < ay * 0.4) return vert;
  if (ay < ax * 0.4) return lat;
  return vert + ' and ' + lat;
}
const yd = n => { const r = Math.round(n); return r + (r === 1 ? ' yard' : ' yards'); };
function depthOf(play, pt) { return isDefPlay(play) ? pt[1] : -pt[1]; }

/* ---------------- grading ---------------- */
function findBreaks(route) {
  const out = [];
  let s = 0;
  for (let i = 1; i < route.length - 1; i++) {
    s += dist(route[i - 1], route[i]);
    const a = angleOf([route[i][0] - route[i - 1][0], route[i][1] - route[i - 1][1]]);
    const b = angleOf([route[i + 1][0] - route[i][0], route[i + 1][1] - route[i][1]]);
    if (angDiff(a, b) > 0.6 && dist(route[i - 1], route[i]) > 0.8) out.push({ i, s, pt: route[i] });
  }
  return out;
}
function userTurnNear(trace, sTarget, window) {
  // find the sharpest turn of the user's trace within +/- window yards (arc length) of sTarget
  const R = resample(trace, Math.max(12, Math.round(polyLen(trace) / 0.5)));
  const step = polyLen(trace) / (R.length - 1);
  const k = Math.max(2, Math.round(1.5 / step));
  let best = null;
  for (let i = k; i < R.length - k; i++) {
    const s = i * step; if (Math.abs(s - sTarget) > window) continue;
    const a = angleOf([R[i][0] - R[i - k][0], R[i][1] - R[i - k][1]]);
    const b = angleOf([R[i + k][0] - R[i][0], R[i + k][1] - R[i][1]]);
    const t = angDiff(a, b);
    if (!best || t > best.t) best = { t, pt: R[i], s };
  }
  return best && best.t > 0.45 ? best : null;
}

function grade(play, p, trace, opts) {
  const tips = [];
  const formation = play.cat === 'Formation';
  let truth = formation ? [huddleSpot(play), [p.x, p.y]] : fullRoute(p);
  const endT = truth[truth.length - 1], endU = trace[trace.length - 1];
  const endErr = dist(endT, endU);
  const lenT = polyLen(truth), lenU = polyLen(trace);

  if (formation) {
    const score = clampScore(100 * (1 - (endErr - 0.6) / 5));
    const dx = endU[0] - endT[0], dy = endU[1] - endT[1];
    if (endErr <= 1) tips.push(['ok', 'Right on your spot. That is your alignment in ' + play.name + '.']);
    else {
      if (Math.abs(dx) > 0.9) {
        const wider = Math.abs(endU[0]) > Math.abs(endT[0]);
        tips.push(['warn', 'You lined up ' + yd(Math.abs(dx)) + ' too ' + (wider ? 'wide' : 'tight') + '. Move ' + (dx > 0 ? 'left' : 'right') + '.']);
      }
      if (Math.abs(dy) > 0.9) tips.push(['warn', 'You were ' + yd(Math.abs(dy)) + (dy > 0 ? ' too deep. Come up closer to the line.' : ' too close to the line. Back off the ball.')]);
    }
    const onLine = Math.abs(endT[1]) < 0.6;
    if (p.id !== 'Q' && !['LT', 'LG', 'C', 'RG', 'RT'].includes(p.id)) tips.push(['info', onLine ? 'In this formation you are ON the line of scrimmage.' : 'In this formation you are OFF the ball (in the backfield).']);
    return { score, tips, truth };
  }

  const N = 48; const A = resample(truth, N), B = resample(trace, N);
  let mean = 0; for (let i = 0; i < N; i++) mean += dist(A[i], B[i]); mean /= N;
  let miss = 0; A.forEach(q => { miss = Math.max(miss, nearestOnPoly(trace, q).d); });
  let score = clampScore(100 * (1 - (0.45 * mean + 0.35 * endErr + 0.2 * miss - 0.9) / 5));

  // 1. motion
  const motion = p.motion && p.motion.length ? [[p.x, p.y], ...p.motion] : null;
  if (motion) {
    const mEnd = motion[motion.length - 1]; const near = nearestOnPoly(trace, mEnd);
    const v = [mEnd[0] - p.x, mEnd[1] - p.y];
    if (near.d > 2.2) tips.push(['no', 'Start with your motion: before the snap, go in motion ' + dirWords(play, p, v) + ' about ' + yd(Math.hypot(v[0], v[1])) + ', then run the play.']);
    else tips.push(['ok', 'Good motion before the snap.']);
  }

  // 2. wrong way / finish direction
  const lastLeg = [endT[0] - truth[Math.max(0, truth.length - 2)][0], endT[1] - truth[Math.max(0, truth.length - 2)][1]];
  const uBack = pointAt(trace, Math.max(0, lenU - Math.min(3, lenU * 0.3)));
  const uLeg = [endU[0] - uBack[0], endU[1] - uBack[1]];
  const startT = truth[0];
  const netT = [endT[0] - startT[0], endT[1] - startT[1]], netU = [endU[0] - trace[0][0], endU[1] - trace[0][1]];
  if (Math.abs(netT[0]) > 2.5 && Math.sign(netT[0]) !== Math.sign(netU[0]) && Math.abs(netU[0]) > 1.5) {
    tips.push(['no', 'Wrong way. This route ends ' + lateralWord(play, p, netT[0]) + '.']);
  } else if (Math.hypot(...uLeg) > 0.8 && Math.hypot(...lastLeg) > 0.8 && angDiff(angleOf(lastLeg), angleOf(uLeg)) > 1.0) {
    tips.push(['warn', 'Check your finish. The last part of this route goes ' + dirWords(play, p, lastLeg) + '.']);
  }

  // 3. break depth
  const route = p.path && p.path.length ? [motion ? motion[motion.length - 1] : [p.x, p.y], ...p.path] : null;
  if (route) {
    const breaks = findBreaks(route);
    const offset = motion ? polyLen(motion) : 0;
    if (breaks.length) {
      const b = breaks[0]; const s0 = route[0];
      const want = Math.abs(depthOf(play, b.pt) - depthOf(play, s0));
      const u = userTurnNear(trace, offset + b.s, Math.max(3, b.s * 0.6));
      if (want >= 1.5) {
        if (!u) tips.push(['warn', 'Make a sharp cut. Run about ' + yd(want) + ', then break.']);
        else {
          const got = Math.abs(depthOf(play, u.pt) - depthOf(play, s0));
          if (Math.abs(got - want) > 1.4) tips.push(['warn', 'You ran about ' + yd(got) + ' before your cut. The playbook says about ' + yd(want) + '. ' + (got < want ? 'Go deeper before you cut.' : 'Cut sooner.')]);
          else tips.push(['ok', 'Good break depth (about ' + yd(want) + ' before the cut).']);
        }
      }
    }
  }

  // 4. length / finish spot
  if (lenU < lenT * 0.65) tips.push(['warn', 'Keep going. Your route is about ' + yd(lenT) + ' long; you ran about ' + yd(lenU) + '.']);
  else if (lenU > lenT * 1.5 && lenT > 2) tips.push(['warn', 'You ran too far. Stop where the route ends.']);
  else if (endErr > 2) {
    const v = [endT[0] - endU[0], endT[1] - endU[1]]; const parts = [];
    const deeper = isDefPlay(play) ? v[1] > 0 : v[1] < 0;
    if (Math.abs(v[1]) > 0.8) parts.push('about ' + yd(Math.abs(v[1])) + (deeper ? ' deeper' : ' shorter'));
    if (Math.abs(v[0]) > 0.8) parts.push('about ' + yd(Math.abs(v[0])) + ' more ' + lateralWord(play, p, v[0]).replace('to ', 'to '));
    tips.push(['warn', 'Your finish spot was ' + yd(endErr) + ' off. Finish ' + parts.join(' and ') + '.']);
  }

  // 5. zone
  const zone = (play.zones || []).find(z => z.owner === p.id);
  if (zone) {
    const dz = dist([zone.x, zone.y], endU);
    if (dz <= zone.r) tips.push(['ok', 'You got to your zone (the shaded circle).']);
    else tips.push(['warn', 'Get to your zone. You finished ' + yd(dz - zone.r) + ' outside the shaded circle.']);
  }

  // 6. assignment reminder
  if (p.carrier) tips.push(['info', 'You get the ball on this play. Take the handoff and hit the hole hard.']);
  if (p.end === 'handoff') tips.push(['info', 'Mesh with the ball carrier and hand it off at the small circle. Then carry out your fake.']);
  if (p.end === 'drop') tips.push(['info', 'Take your drop to the circle, set your feet, read it and throw.']);
  if (p.end === 'block') tips.push(['info', 'The T at the end of your line means block. Finish your block.']);
  if (p.dashed && !isDefPlay(play) && p.end === 'block' && play.cat === 'Pass') tips.push(['info', 'Dashed line to a T: you stay in and pass protect.']);
  else if (play.cat === 'Run' && p.motion && !p.carrier) tips.push(['info', 'Your motion takes you to the point of attack. You are the extra blocker there, so lead and block.']);
  else if (play.cat === 'Run' && p.dashed && !p.carrier && p.end === 'arrow') tips.push(['info', 'Dashed line means a fake. Sell it like you have the ball.']);
  if (isDefPlay(play) && p.dashed) tips.push(['info', 'Dotted line: that is your rush lane or the man you take. Read it at the snap.']);

  if (score >= 85 && !tips.some(t => t[0] === 'no' || t[0] === 'warn')) tips.unshift(['ok', 'That matches the playbook. Nice work.']);
  return { score, tips, truth };
}
function clampScore(v) { return Math.max(0, Math.min(100, Math.round(v))); }
function verdict(score) {
  if (score >= 85) return ['Nailed it', 'good'];
  if (score >= 65) return ['Close', 'mid'];
  if (score >= 40) return ['Getting there', 'mid'];
  return ['Not yet', 'low'];
}

/* ---------------- state ---------------- */
const state = {
  view: 'menu', open: store.get('open', []), speed: store.get('speed', 'learn'),
  play: null, reveal: false, revealedDuringDrill: false,
  phase: 'pick',          // pick | drag | done | info
  sel: null, trace: [], result: null,
  anim: null, quick: null
};
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------------- menu ---------------- */
function bestKey(play) { return 'best:' + play.id; }
function renderMenu() {
  stopAnim();
  state.view = 'menu';
  const chev = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  const groups = CATS.map(c => {
    const plays = PLAYS.filter(p => p.cat === c);
    if (!plays.length) return '';
    const done = plays.filter(p => store.get(bestKey(p), null) != null).length;
    const open = state.open.includes(c);
    return `<section class="group"><button class="ghead" data-g="${c}" aria-expanded="${open}" aria-controls="list-${c}">
        <span class="gmark" style="background:${CAT_INFO[c].mark}"></span>
        <span class="gtext"><span class="gname">${CAT_LABEL[c]}</span><span class="gdesc">${CAT_INFO[c].desc}</span></span>
        <span class="gcount">${done ? done + ' of ' + plays.length + ' done' : plays.length + (c === 'Formation' ? ' formations' : ' plays')}</span>${chev}</button>
      <div class="list" id="list-${c}" ${open ? '' : 'hidden'}>${plays.map((p, i) => {
        const b = store.get(bestKey(p), null);
        const cls = b == null ? '' : b >= 85 ? 'good' : b >= 50 ? 'mid' : 'low';
        return `<button class="play-row" data-id="${p.id}"><span class="n">${p.cat === 'Defense' ? p.num : i + 1}</span><span class="t"><b>${esc(p.name)}</b>${p.note ? `<span>${esc(p.note)}</span>` : ''}</span><span class="badge ${cls}">${b == null ? 'new' : 'best ' + b}</span></button>`;
      }).join('')}</div></section>`;
  }).join('');
  app.innerHTML = `
    <header class="brand"><h1>${esc(APP_NAME)} <span class="num">2026</span></h1><p>${esc(SOURCE.label || '')}</p></header>
    <ol class="howto"><li><b>1</b>Open a group and pick a play</li><li><b>2</b>Tap your position</li><li><b>3</b>Drag your route</li></ol>
    <button class="quick" id="quick"><div><b>Quick drill</b><span>5 random plays. Tap your spot, run your route, get a report card.</span></div><span class="go">Start</span></button>
    <div class="groups">${groups}</div>
    <p class="foot">${VERSION} · Study tool built from ${esc(SOURCE.detail || 'the team playbook')}. Best scores are saved on this device only.${isStandalone() ? '' : ' <button class="link" id="a2hs-foot">Add to Home Screen</button>'}</p>`;
  app.querySelectorAll('.ghead').forEach(b => b.onclick = () => {
    const c = b.dataset.g; const open = b.getAttribute('aria-expanded') !== 'true';
    b.setAttribute('aria-expanded', open); document.getElementById('list-' + c).hidden = !open;
    state.open = open ? [...new Set([...state.open, c])] : state.open.filter(x => x !== c); store.set('open', state.open);
  });
  app.querySelectorAll('.play-row').forEach(b => b.onclick = () => { state.quick = null; openPlay(PLAYS.find(p => p.id === b.dataset.id)); });
  document.getElementById('quick').onclick = startQuick;
  const af = document.getElementById('a2hs-foot'); if (af) af.onclick = openA2HS;
  window.scrollTo(0, 0);
}

/* ---------------- quick drill ---------------- */
function startQuick() {
  const pool = PLAYS.filter(p => p.cat !== 'Formation');
  const pick = pool.slice().sort(() => Math.random() - 0.5).slice(0, Math.min(5, pool.length));
  state.quick = { list: pick, i: 0, results: [] };
  openPlay(pick[0]);
}
function quickNext() {
  const q = state.quick; q.i++;
  if (q.i >= q.list.length) return renderSummary();
  openPlay(q.list[q.i]);
}
function renderSummary() {
  stopAnim();
  const q = state.quick; const avg = Math.round(q.results.reduce((s, r) => s + r.score, 0) / Math.max(1, q.results.length));
  const [word] = verdict(avg);
  const weak = q.results.filter(r => r.score < 70);
  app.innerHTML = `
    <div class="bar"><button class="back" id="back">← Plays</button><div class="title"><div class="cat">Quick drill</div><h2>Report card</h2></div></div>
    <div class="feedback"><div class="score"><div class="ring" style="--p:${avg};--rc:var(--${avg >= 85 ? 'good' : avg >= 50 ? 'warn' : 'bad'})"><span>${avg}</span></div><div><h3>${word}</h3><p>Average across ${q.results.length} plays.</p></div></div>
    <ul class="tips">${weak.length ? `<li class="warn"><i>!</i><span>Review ${weak.map(r => '<b>' + esc(r.play.name) + '</b>').join(', ')}. Hit Reveal, watch it in Learn speed, then drill it again.</span></li>` : `<li class="ok"><i>✓</i><span>Every play scored 70 or better. Try Real speed, or drill a different position.</span></li>`}</ul></div>
    <div class="summary">${q.results.map(r => `<button class="row play-row" style="grid-template-columns:1fr auto" data-id="${r.play.id}"><span class="t"><b>${esc(r.play.name)}</b><span>${esc(roleName(r.player))}</span></span><span class="badge ${verdict(r.score)[1]}">${r.score}</span></button>`).join('')}</div>
    <div class="actions"><button class="btn primary" id="again">New quick drill</button><button class="btn" id="menu">All plays</button></div>`;
  document.getElementById('back').onclick = renderMenu; document.getElementById('menu').onclick = renderMenu;
  document.getElementById('again').onclick = startQuick;

}
function runPlay(focus) {
  if (state.anim) { stopAnim(); drawField(); return; }
  if (state.phase === 'drag') { flashPrompt('Finish your drag first, or tap Reveal to peek.'); return; }
  const play = state.play;
  if (play.cat === 'Formation') { animateFormation(focus); return; }
  const learn = state.speed === 'learn';
  const ramp = learn ? 0.9 : 0.35;
  const tracks = play.players.map(p => {
    const motion = p.motion && p.motion.length ? [[p.x, p.y], ...p.motion] : [[p.x, p.y]];
    const mEnd = motion[motion.length - 1];
    let path = p.path && p.path.length ? [mEnd, ...p.path] : [mEnd];
    let ghost = false;
    if (path.length === 1) { const fs = firstStep(play, p); if (fs) { path = [mEnd, fs]; ghost = true; } }

  });

  const carrier = tracks.find(t => t.p.carrier);
  const handoffAt = q && carrier && !q.ghost ? snap + timeToCover(q.pLen, q.v, ramp) : Infinity;
  const t0 = performance.now(); const btn = document.getElementById('run'); if (btn) btn.textContent = 'Stop ■';
  const saveSel = state.sel, savePhase = state.phase, saveTrace = state.trace;
  const frame = now => {
    const t = (now - t0) / 1000;
    const pos = {}; const trails = [];
    tracks.forEach(tr => {
      let cur, trail = null;
      const tm = t - setTime;
      if (t < snap) { const d = Math.min(tr.mLen, Math.max(0, tm) * tr.mv); cur = pointAt(tr.motion, d); if (tr.mLen) trail = partial(tr.motion, d); }
      else { const d = travel(t - snap, tr.v, tr.pLen, ramp); cur = pointAt(tr.path, d); if (!tr.ghost) trail = [...tr.motion, ...partial(tr.path, d).slice(1)]; else if (tr.mLen) trail = tr.motion; }
      pos[tr.p.id] = cur;
      if (trail && trail.length > 1 && (!focus || focus === tr.p)) trails.push({ pts: trail, color: tr.color });
    });

    pos.__ball = t < snap ? front : (t >= handoffAt && carrier ? pos[carrier.p.id] : q ? pos[q.p.id] : centerSpot(play));

    state.sel = focus || null; state.phase = 'anim'; state.trace = [];
    drawField(pos, trails);
    state.sel = saveSel; state.phase = savePhase; state.trace = saveTrace;

}
function partial(poly, d) {
  const out = [poly[0]]; let acc = 0;

}
function animateFormation(focus) {
  const play = state.play; const hs = huddleSpot(play); const sp = SPEED[state.speed] * 1.4;
  const tracks = play.players.map(p => ({ p, path: [hs, [p.x, p.y]], L: dist(hs, [p.x, p.y]) }));
  const total = Math.max(...tracks.map(t => timeToCover(t.L, sp, 0.5))) + 1.1;
  const t0 = performance.now(); const btn = document.getElementById('run'); if (btn) btn.textContent = 'Stop ■';
  const saveSel = state.sel, savePhase = state.phase, saveTrace = state.trace;
  const frame = now => {
    const t = (now - t0) / 1000; const pos = {};
    tracks.forEach(tr => { pos[tr.p.id] = pointAt(tr.path, travel(t, sp, tr.L, 0.5)); });
    pos.__ball = centerSpot(play);
    if (t > total - 0.9) pos.__call = { text: 'SET', a: Math.min(1, (t - (total - 0.9)) * 3) };
    state.sel = focus || null; state.phase = 'anim'; state.trace = [];
    drawField(pos, []);
    state.sel = saveSel; state.phase = savePhase; state.trace = saveTrace;
    if (t < total) state.anim.raf = requestAnimationFrame(frame);
    else { state.anim = null; if (btn) btn.textContent = 'Run ▶'; drawField(); }
  };

}

  const div = document.createElement('div');

  div.innerHTML = `<svg class="introfield" id="introfield" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>

function closeIntro() {
  const d = document.getElementById('intro'); if (!d) return;
  d.classList.add('gone'); cancelAnimationFrame(introRaf);
  setTimeout(() => d.remove(), 500);
}
function animateIntroField() {
  const f = document.getElementById('introfield'); if (!f) return;
  const play = PLAYS.find(p => p.id === 'hawk-right') || PLAYS.find(p => p.cat === 'Pass'); if (!play) return;
  const b = bounds(play);
  f.setAttribute('viewBox', `${b.x0 - 3} ${b.y0 - 3} ${b.w + 6} ${b.h + 6}`);
  const draw = t => {
    f.innerHTML = '';
    for (let y = Math.ceil((b.y0 - 60) / 5) * 5; y < b.y0 + b.h + 60; y += 5) el('line', { x1: b.x0 - 60, x2: b.x0 + b.w + 60, y1: y, y2: y, stroke: '#ffffff', 'stroke-opacity': y === 0 ? 0.28 : 0.08, 'stroke-width': y === 0 ? 0.2 : 0.12 }, f);
    const go = Math.max(0, t - 0.9); const r = dotRadius(play);
    play.players.forEach(p => {
      const route = fullRoute(p); const L = polyLen(route);
      const d = travel(go, 6, L, 0.4); const cur = pointAt(route, d);
      const color = playerColor(play, p);
      if (L > 0.5 && d > 0) el('polyline', { points: pts(partial(route, d)), fill: 'none', stroke: color, 'stroke-width': 0.3, 'stroke-opacity': 0.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, f);
      el('circle', { cx: cur[0], cy: cur[1], r: r * 0.8, fill: color, 'fill-opacity': 0.75 }, f);
    });
  };

  const t0 = performance.now();
  const loop = now => { const t = ((now - t0) / 1000) % 6; draw(t); introRaf = requestAnimationFrame(loop); };
  introRaf = requestAnimationFrame(loop);
}

function a2hsKey(e) { if (e.key === 'Escape') closeA2HS(); }
